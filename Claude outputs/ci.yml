name: SwiftShare CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read
  security-events: write

jobs:
  # Backend Tests
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build backend
        working-directory: ./backend
        run: cargo build --verbose
      
      - name: Run backend tests
        working-directory: ./backend
        run: cargo test --verbose
      
      - name: Run backend clippy
        working-directory: ./backend
        run: cargo clippy
      
      - name: Run backend fmt check
        working-directory: ./backend
        run: cargo fmt -- --check

  # Desktop Tests
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      
      - name: Install desktop dependencies
        working-directory: ./desktop
        run: npm ci
      
      - name: Run desktop tests
        working-directory: ./desktop
        run: npm test -- --coverage --watchAll=false --passWithNoTests
      
      - name: Build desktop
        working-directory: ./desktop
        run: npm run build

  # Mobile Tests
  mobile:
    runs-on: ubuntu-latest
    env:
      # Empty on forks / PRs without secrets -> the build falls back to the debug key.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
      
      - name: Enable web
        run: flutter config --enable-web
      
      - name: Get dependencies
        working-directory: ./mobile
        run: flutter pub get
      
      - name: Analyze project source
        working-directory: ./mobile
        run: flutter analyze || true
      
      - name: Run tests
        working-directory: ./mobile
        run: flutter test
      
      - name: Restore release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: ./mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > key.properties

      - name: Warn if unsigned
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - APKs are debug-signed and users cannot update over older installs."

      - name: Build release APKs
        working-directory: ./mobile
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=BACKEND_URL=https://swiftshare-e4dh.onrender.com

      - name: Upload APKs for the release job
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: mobile/build/app/outputs/flutter-apk/*-release.apk
          retention-days: 7
          if-no-files-found: error

  # Web Tests
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-frontend/package-lock.json
      
      - name: Install web dependencies
        working-directory: ./web-frontend
        run: npm ci
      
      - name: Run web lint
        working-directory: ./web-frontend
        run: npm run lint
      
      - name: Build web
        working-directory: ./web-frontend
        run: npm run build

  # Docker Build
  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t swiftshare:latest .
      
      - name: Test Docker image
        run: |
          docker run -d --name swiftshare-test -p 3001:3001 swiftshare:latest
          sleep 10
          curl -f http://localhost:3001/health || exit 1
          docker stop swiftshare-test
          docker rm swiftshare-test

  # Security Scan
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: github.event_name == 'push'
        with:
          sarif_file: 'trivy-results.sarif'

  # Release
  release:
    runs-on: ubuntu-latest
    needs: [backend, desktop, mobile, web, docker, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write        # ← overrides top-level contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build backend release binary
        working-directory: ./backend
        run: |
          cargo build --release
          tar -czf swiftshare-backend-${{ github.run_number }}.tar.gz target/release/swiftshare-backend

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: apks

      - name: Name APKs by version
        working-directory: ./apks
        run: |
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "SwiftShare-v1.0.${{ github.run_number }}-${abi}.apk"
          done
          ls -la

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: SwiftShare v1.0.${{ github.run_number }}
          body: |
            ## 📱 Android app
            Download **`SwiftShare-v1.0.${{ github.run_number }}-arm64-v8a.apk`** below - it works on almost every Android phone from the last ~8 years.
            Open it on your phone and allow "Install unknown apps" for your browser when asked.

            | File | For |
            |---|---|
            | `...-arm64-v8a.apk` | Most phones (recommended) |
            | `...-armeabi-v7a.apk` | Older 32-bit phones |
            | `...-x86_64.apk` | Emulators / Chromebooks |

            🌐 Web app: https://swift-share-tau.vercel.app

            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ./backend/swiftshare-backend-${{ github.run_number }}.tar.gz
            ./apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
