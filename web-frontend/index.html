<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta with target keyword first -->
    <title>Share Files Online Free - SwiftShare</title>
    <meta
      name="description"
      content="Upload files or paste text and get a free, temporary share link with QR code in seconds. No signup required. Limit downloads to 1-10 people and transfer files fast."
    />
    <meta
      name="keywords"
      content="share files online, free file sharing, file transfer, upload files, send files, file sharing no signup, temporary file share, share files with link"
    />
    <meta name="author" content="SwiftShare" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#6754df" />
    <link rel="canonical" href="https://swift-share-tau.vercel.app/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Performance: preconnect to third-party origins used by the page -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph -->
    <meta property="og:title" content="Share Files Online Free - SwiftShare" />
    <meta
      property="og:description"
      content="Upload files or paste text and get a free, temporary share link with QR code in seconds. No signup required. Limit downloads to 1-10 people and transfer files fast."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://swift-share-tau.vercel.app/" />
    <meta property="og:site_name" content="SwiftShare" />
    <meta property="og:image" content="https://swift-share-tau.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="SwiftShare - share files, text, APK, JSON, and PDF online free with temporary download links and QR codes."

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Share Files Online Free - SwiftShare" />
    <meta
      name="twitter:description"
      content="Upload files or paste text and get a free, temporary share link with QR code in seconds. No signup required. Limit downloads to 1-10 people and transfer files fast."
    />
    <meta name="twitter:image" content="https://swift-share-tau.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="SwiftShare social share image" />

          "name": "SwiftShare",

          "logo": "https://swift-share-tau.vercel.app/favicon.svg",
          "sameAs": [
            "https://x.com/AyushPande28353",
            "https://github.com/AyushPandey510",
            "https://www.linkedin.com/in/ayush-pandey-097027242/"
          ]

        {
          "@type": "WebSite",
          "url": "https://swift-share-tau.vercel.app/",
          "name": "SwiftShare",

          "publisher": {
            "@type": "Organization",

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
